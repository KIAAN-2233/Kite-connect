name: Build Desktop Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Zerodha Desktop Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check project
        working-directory: Zerodha-Clone-main/frontend
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          test -f package.json

      - name: Install dependencies
        working-directory: Zerodha-Clone-main/frontend
        run: npm install

      - name: Build React application
        working-directory: Zerodha-Clone-main/frontend
        run: npm run build

      - name: Create desktop build ZIP
        working-directory: Zerodha-Clone-main/frontend
        run: |
          if [ -d "dist" ]; then
            zip -r ../../../zerodha-desktop-build.zip dist
          elif [ -d "build" ]; then
            zip -r ../../../zerodha-desktop-build.zip build
          else
            echo "ERROR: npm run build did not create dist or build."
            exit 1
          fi

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: zerodha-desktop-build
          path: zerodha-desktop-build.zip
          if-no-files-found: error

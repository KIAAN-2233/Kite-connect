name: Build Desktop Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Zerodha Desktop Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Locate desktop project
        shell: bash
        run: |
          set -e

          echo "=== Repository files ==="
          find . -maxdepth 3 -type f | sort | head -250

          # Prefer the desktop ZIP used for this project.
          ZIP_FILE=""

          if [ -f "./Zerodha-Clone-main-2026-Desktop-Demo.zip" ]; then
            ZIP_FILE="./Zerodha-Clone-main-2026-Desktop-Demo.zip"
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP was found."
            exit 1
          fi

          echo "Project ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== package.json files found ==="
          find extracted -type f -name "package.json" -print

          # IMPORTANT:
          # The ZIP contains several package.json files.
          # The root package.json has no build script.
          # The actual React application is the frontend package.json.
          FRONTEND_PACKAGE=$(find extracted -type f -path "*/frontend/package.json" | head -1 || true)

          if [ -z "$FRONTEND_PACKAGE" ]; then
            echo "ERROR: frontend/package.json was not found."
            echo "All package.json files:"
            find extracted -type f -name "package.json" -print
            exit 1
          fi

          FRONTEND_DIR=$(dirname "$FRONTEND_PACKAGE")

          echo "Frontend package: $FRONTEND_PACKAGE"
          echo "Frontend directory: $FRONTEND_DIR"

          test -f "$FRONTEND_DIR/package.json"

          echo "=== Frontend package.json ==="
          cat "$FRONTEND_DIR/package.json"

          echo "FRONTEND_DIR=$FRONTEND_DIR" >> "$GITHUB_ENV"

      - name: Verify build script
        working-directory: ${{ env.FRONTEND_DIR }}
        shell: bash
        run: |
          set -e
          echo "Working directory:"
          pwd

          echo "Available npm scripts:"
          npm run

          node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts.build) { console.error('ERROR: frontend package.json has no build script'); process.exit(1); } console.log('Build script:', p.scripts.build)"

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm install

      - name: Build React application
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Create desktop build ZIP
        shell: bash
        run: |
          set -e

          cd "$FRONTEND_DIR"

          if [ -d "dist" ]; then
            echo "Found Vite dist directory."
            cd -
            rm -f zerodha-desktop-build.zip
            cd "$FRONTEND_DIR"
            zip -r "$GITHUB_WORKSPACE/zerodha-desktop-build.zip" dist
          elif [ -d "build" ]; then
            echo "Found build directory."
            cd -
            rm -f zerodha-desktop-build.zip
            cd "$FRONTEND_DIR"
            zip -r "$GITHUB_WORKSPACE/zerodha-desktop-build.zip" build
          else
            echo "ERROR: npm run build completed but no dist/ or build/ directory exists."
            exit 1
          fi

          echo "Created:"
          ls -lh "$GITHUB_WORKSPACE/zerodha-desktop-build.zip"

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: zerodha-desktop-build
          path: zerodha-desktop-build.zip
          if-no-files-found: error

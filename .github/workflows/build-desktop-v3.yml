name: Build Desktop Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Zerodha Desktop Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Locate desktop project
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -200

          # Case 1: project is already checked into the repository.
          if [ -f "package.json" ]; then
            FRONTEND_DIR="."
          else
            # Case 2: project is stored inside a ZIP in the repository.
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No package.json and no ZIP file were found."
              exit 1
            fi

            echo "Using project ZIP: $ZIP_FILE"
            rm -rf extracted
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted

            FRONTEND_PACKAGE=$(find extracted -type f -name "package.json" | head -1)

            if [ -z "$FRONTEND_PACKAGE" ]; then
              echo "ERROR: No package.json found inside the ZIP."
              find extracted -maxdepth 5 -type f | sort | head -200
              exit 1
            fi

            FRONTEND_DIR=$(dirname "$FRONTEND_PACKAGE")
          fi

          echo "Frontend directory: $FRONTEND_DIR"
          test -f "$FRONTEND_DIR/package.json"

          # Save the detected directory for following steps.
          echo "FRONTEND_DIR=$FRONTEND_DIR" >> "$GITHUB_ENV"

          echo "Frontend files:"
          ls -la "$FRONTEND_DIR"

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm install

      - name: Build React application
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Create desktop build ZIP
        shell: bash
        run: |
          set -e
          cd "$FRONTEND_DIR"

          if [ -d "dist" ]; then
            cd -
            zip -r zerodha-desktop-build.zip "$FRONTEND_DIR/dist"
          elif [ -d "build" ]; then
            cd -
            zip -r zerodha-desktop-build.zip "$FRONTEND_DIR/build"
          else
            echo "ERROR: npm run build did not create dist or build."
            exit 1
          fi

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: zerodha-desktop-build
          path: zerodha-desktop-build.zip
          if-no-files-found: error

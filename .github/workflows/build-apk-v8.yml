name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Zerodha APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract dashboard project
        run: |
          rm -rf app extracted
          mkdir -p app extracted

          unzip -q Kite-Mobile-Positions-Reference-v8-motorola-edge-40-neo.zip -d extracted

          echo "Searching for package.json..."

          PACKAGE_JSON=$(find extracted -type f -name "package.json" -print -quit)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            echo "ZIP contents:"
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "React project found at: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. app/

          echo "Final app directory:"
          ls -la app

          echo "Checking package.json:"
          test -f app/package.json

      - name: Install React dependencies
        working-directory: app
        run: npm install

      - name: Build React dashboard
        working-directory: app
        run: npm run build

      - name: Install Capacitor
        working-directory: app
        run: |
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

      - name: Create Capacitor configuration
        working-directory: app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kiaan.zerodhademo",
            "appName": "Zerodha",
            "webDir": "dist"
          }
          EOF

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Sync Android project
        working-directory: app
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Android APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zerodha-demo-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

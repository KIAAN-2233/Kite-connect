name: Build Zerodha Desktop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build React Desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract Zerodha project
        run: |
          rm -rf source
          mkdir source
          unzip -q "Zerodha-Clone-main-2026-Kite-Mobile.zip" -d source

      - name: Locate frontend
        run: |
          echo "Project contents:"
          find source -maxdepth 3 -type f | head -100

      - name: Install dependencies
        working-directory: source/Zerodha-Clone-main/frontend
        run: npm install

      - name: Build React application
        working-directory: source/Zerodha-Clone-main/frontend
        run: npm run build

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: zerodha-desktop-build
          path: source/Zerodha-Clone-main/frontend/dist
